# Review Render's current quote before creating any resources.
# Paid services keep the preview available; email and paid AI stay disabled.
services:
  - type: web
    name: household-preview
    runtime: docker
    plan: starter
    healthCheckPath: /health/
    preDeployCommand: python manage.py migrate --noinput
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: localhost,127.0.0.1
      - key: DJANGO_TRUST_PROXY
        value: "true"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: household-preview-db
          property: connectionString
      - key: WORKFORCE_OUTBOUND_MODE
        value: preview
      - key: WORKFORCE_PAID_AI
        value: "false"
  - type: worker
    name: household-preview-worker
    runtime: docker
    plan: starter
    dockerCommand: python manage.py run_worker --poll 5
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: household-preview
          envVarKey: DJANGO_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: household-preview-db
          property: connectionString
      - key: WORKFORCE_OUTBOUND_MODE
        value: preview
      - key: WORKFORCE_PAID_AI
        value: "false"
databases:
  - name: household-preview-db
    plan: basic-256mb
    databaseName: workforce
    user: workforce
    ipAllowList: []
